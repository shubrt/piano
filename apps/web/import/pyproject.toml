[project]
name = "piano-import"
version = "0.1.0"
description = "Worker that turns a YouTube URL or an audio file into MIDI: yt-dlp, ffmpeg, transkun"
requires-python = ">=3.12,<3.13"
dependencies = [
  "transkun==2.0.1",
  # transkun imports pkg_resources, which setuptools 81 removed.
  "setuptools<81",
  "yt-dlp>=2026.1.1",
  "psycopg[binary]>=3.2",
  # Listed here so the CPU index below applies; transkun pulls them in anyway.
  "torch",
  "torchaudio",
]

# The Docker image gets torch from the CPU index, a fraction of the CUDA wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
