# Local Postgres for the dev server. Shared by every worktree, like
# ~/.piano/songs used to be: docker compose up -d
# The fixed project name keeps every worktree on the same container and volume.
name: piano
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: piano
      POSTGRES_USER: piano
      POSTGRES_PASSWORD: piano
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piano -d piano"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - piano-postgres:/var/lib/postgresql/data

volumes:
  piano-postgres:
